<!DOCTYPE html>
<html><head>
	<title>Localization CSV Merger</title>
	<link rel="stylesheet" href="style.css"/>
</head><body>
	<main>
		<h1>YAL's Localization CSV Merger</h1>
		<p>
			It is primarily intended for
			<a href="https://yellowafterlife.itch.io/gamemaker-cmn-loc" target="_blank">cmnLoc</a>,
			but maybe you can use it for something else too.
		</p>
		<!-- -->
		<fieldset id="base">
			<legend>Base (fields to keep)</legend>
			<label>
				Context column
				<select id="base-ctx" class="context">
					<option selected value="auto">Auto</option>
					<option value="on">On</option>
					<option value="off">Off</option>
				</select>
			</label>
			<form class="textarea-row" id="base-form">
				<input type="file" id="base-pick" />
			</form>
			<textarea id="base-text" placeholder="Group,Key,Context,Text&#10;Init,GameName,,Nuclear Throne"></textarea>
		</fieldset>
		<!-- -->
		<fieldset id="patch">
			<legend>Patch (fields to merge)</legend>
			<label>
				Context column
				<select id="patch-ctx" class="context">
					<option selected value="auto">Auto</option>
					<option value="on">On</option>
					<option value="off">Off</option>
				</select>
			</label>
			<form class="textarea-row" id="patch-form">
				<input type="file" id="patch-pick" />
			</form>
			<textarea id="patch-text" placeholder="Group,Key,Context,Text&#10;Init,GameName,,Nuclear Throne"></textarea>
		</fieldset>
		<fieldset>
			<legend>Other settings</legend>
			<label for="skip-groups">Skip these groups</label>
			<textarea id="skip-groups" placeholder="DevMenu&#10;Debug*"></textarea>
			
			<label for="skip-exceptions">But keep these Group:Key pairs</label>
			<textarea id="skip-exceptions" placeholder="Debug:Important"></textarea>
			
			<label>
				Context column in Result
				<select id="result-ctx">
					<option selected value="auto">Auto</option>
					<option value="on">On</option>
					<option value="off">Off</option>
				</select>
			</label>
		</fieldset>
		<!-- -->
		<input type="button" value="Merge!" id="merge"/>
		<form class="textarea-row">
			<label for="result">Result</label>
			<input type="button" id="result-save" value="Download" />
		</form>
		<textarea id="result" placeholder="Merged CSV will appear here!"></textarea>
		<!-- -->
		<script src="csv.js"></script>
		<script src="fileSaver.min.js"></script>
		<script src="script.js"></script>

	</main>
</body></html>
